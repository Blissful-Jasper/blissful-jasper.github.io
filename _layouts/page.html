---
layout: default
---

<article class="page-shell">
  <header class="page-header">
    <p class="eyebrow">{{ page.kicker | default: 'Xianpu Ji' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
