<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>

      <span class="brand-name">{{ site.title }}</span>
      <span class="brand-note">{{ site.author.title | default: 'Academic Blog' }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-menu">
      <span></span>
      <span></span>
      <span></span>
      <span class="sr-only">Toggle navigation</span>
    </button>

    <div class="nav-panel" id="primary-menu">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/research.html' | relative_url }}" {% if page.url contains '/research' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/publications.html' | relative_url }}" {% if page.url contains '/publications' %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/projects.html' | relative_url }}" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/blog.html' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/links.html' | relative_url }}" {% if page.url contains '/links' %}aria-current="page"{% endif %}>Links</a>
      <a href="{{ '/notes.html' | relative_url }}" {% if page.url contains '/notes' %}aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/cv.html' | relative_url }}" {% if page.url contains '/cv' %}aria-current="page"{% endif %}>CV</a>
      <a href="{{ '/about.html' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a>
      <button class="theme-button" type="button" aria-label="Toggle color theme" data-theme-toggle>Theme</button>
    </div>
  </nav>
