title: "Xianpu Ji"
email: xianpuji@hhu.edu.cn
description: >-
  Personal academic website and research blog on tropical atmospheric dynamics,
  convectively coupled equatorial waves, tropical precipitation variability,
  climate model evaluation, and meteorological data analysis.
baseurl: ""
url: "https://blissful-jasper.github.io"
lang: zh-CN

author:
  name: Xianpu Ji
  title: PhD Candidate in Marine Science
  affiliation: Hohai University
  email: xianpuji@hhu.edu.cn

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

highlighter: rouge
permalink: pretty
future: false
show_drafts: false
unpublished: false
safe: true

mathjax:
  enable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

collections:
  pages:
    output: true
    permalink: /:name/

include:
  - pictures

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - .sass-cache/
  - .jekyll-cache/
